# Priority = threat_intel_relevance (1-5) x data_availability (1-5) x (6 - effort) / 5
#   threat_intel_relevance: how strongly current intel / incidents / ATT&CK prevalence
#                           for logistics-sector intrusions point at this behaviour
#   data_availability:      5 = source collected, parsed, >=14d retention; 1 = not collected
#   effort:                 1 (an afternoon) .. 5 (multi-week)
# The CLI recomputes `priority` from these inputs; the stored value is for readers.
# status: executed | queued | blocked-data-gap

